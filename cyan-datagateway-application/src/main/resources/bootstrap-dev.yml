spring:
  config:
    import:
      - "nacos:arch-base.yaml?group=DEFAULT_GROUP&namespace=dev"
      - "nacos:cyan-datagateway.yaml?group=DEFAULT_GROUP&namespace=dev"
  cloud:
    nacos:
      server-addr: 10.0.0.2:8848
      username: nacos
      password: nacos
      config:
        file-extension: yaml
        namespace: dev
      discovery:
        ephemeral: true
        namespace: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 123456
    url: jdbc:mysql://10.0.0.2:3306/cyan_datagateway

# StarRocks 配置
starrocks:
  jdbc-url: jdbc:mysql://10.0.0.2:32132/?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
  username: root
  password: 123456

spark:
  spark-master: "spark://10.0.0.2:27077"

rustfs:
  endpoint: http://10.0.0.2:9000
  accessKey: rustfsadmin
  secretKey: rustfsadmin

iceberg:
  uri: http://iceberg-rest.cyan.com/iceberg
