spring:
  config:
    import:
      - "nacos:arch-base.yaml?group=DEFAULT_GROUP&namespace=prod"
      - "nacos:cyan-datagateway.yaml?group=DEFAULT_GROUP&namespace=prod"
  cloud:
    nacos:
      server-addr: 10.0.0.2:8848
      username: nacos
      password: nacos
      config:
        file-extension: yaml
        namespace: prod
      discovery:
        ephemeral: true
        namespace: prod
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 123456
    url: jdbc:mysql://10.0.0.2:3306/cyan_datagateway

# StarRocks 配置
starrocks:
  jdbc-url: jdbc:mysql://kube-starrocks-fe-service.starrocks.svc.cluster.local:9030/?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
  username: root
  password: ""
